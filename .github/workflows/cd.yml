name: CD — Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/crm

jobs:
  # ---------------------------------------------------------------------------
  # Build and Push Docker Images
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - identity
          - customer
          - lead
          - opportunity
          - sales
          - task
          - calendar
          - document
          - workflow
          - notification
          - reporting
          - ai-platform
          - integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build and Push Frontend & Mobile BFF Images
  # ---------------------------------------------------------------------------
  build-and-push-apps:
    name: Build & Push ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app:
          - admin-web
          - crm-web
          - public-web
          - mobile-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-apps]
    if: github.ref == 'refs/heads/main'
    environment: development
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Pin image tags in development overlay
        working-directory: infrastructure/kubernetes/overlays/development
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          PREFIX="${{ env.IMAGE_PREFIX }}"
          SERVICES="identity customer contact lead opportunity organization sales task calendar document workflow notification reporting ai-platform integration"
          APPS="admin-web crm-web public-web mobile-api"
          for name in $SERVICES $APPS; do
            kustomize edit set image "$PREFIX-$name=$PREFIX-$name:sha-$SHORT_SHA"
          done

      - name: Commit updated manifests
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add infrastructure/kubernetes/
          git diff --staged --quiet || git commit -m "chore(cd): update development images to sha-${{ github.sha }}"
          git push

  # ---------------------------------------------------------------------------
  # Deploy to Production (release only)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-apps]
    if: github.event_name == 'release'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy via Argo CD
        run: |
          echo "Production deployment via Argo CD"
          echo "Tag: ${{ github.event.release.tag_name }}"
          # argocd app sync crm-platform --revision ${{ github.event.release.tag_name }}
