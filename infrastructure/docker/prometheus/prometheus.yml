global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: identity-service
    static_configs:
      - targets: ["identity-service:3000"]
    metrics_path: /metrics

  - job_name: customer-service
    static_configs:
      - targets: ["customer-service:3000"]
    metrics_path: /metrics

  - job_name: contact-service
    static_configs:
      - targets: ["contact-service:3000"]
    metrics_path: /metrics

  - job_name: lead-service
    static_configs:
      - targets: ["lead-service:3000"]
    metrics_path: /metrics

  - job_name: opportunity-service
    static_configs:
      - targets: ["opportunity-service:3000"]
    metrics_path: /metrics

  - job_name: organization-service
    static_configs:
      - targets: ["organization-service:3000"]
    metrics_path: /metrics

  - job_name: workflow-service
    static_configs:
      - targets: ["workflow-service:3000"]
    metrics_path: /metrics

  - job_name: integration-service
    static_configs:
      - targets: ["integration-service:3000"]
    metrics_path: /metrics

  - job_name: ai-platform
    static_configs:
      - targets: ["ai-platform:3000"]
    metrics_path: /metrics

  - job_name: mobile-api
    static_configs:
      - targets: ["mobile-api:3000"]
    metrics_path: /metrics

  - job_name: kong
    static_configs:
      - targets: ["kong:8001"]
    metrics_path: /metrics
