groups:
  - name: service-availability
    rules:
      - alert: ServiceDown
        expr: up{job!="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus target {{ $labels.instance }} for job {{ $labels.job }} has been unreachable for more than 1 minute."

  - name: http-latency-and-errors
    rules:
      - alert: HighHttpErrorRate
        expr: |
          sum by (job) (rate(http_requests_total{status_code=~"5.."}[5m]))
            /
          sum by (job) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate for {{ $labels.job }}"
          description: "{{ $labels.job }} is serving more than 5% 5xx responses over the last 5 minutes."

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency for {{ $labels.job }}"
          description: "The 95th percentile request latency for {{ $labels.job }} has exceeded 1s for 10 minutes."

  - name: runtime-resources
    rules:
      - alert: HighProcessMemory
        expr: process_resident_memory_bytes > 1.5e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage for {{ $labels.job }}"
          description: "{{ $labels.job }} ({{ $labels.instance }}) resident memory has exceeded 1.5GB for 10 minutes."

      - alert: EventLoopLagHigh
        expr: nodejs_eventloop_lag_seconds > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event loop lag high for {{ $labels.job }}"
          description: "{{ $labels.job }} Node.js event loop lag exceeded 200ms for 5 minutes, indicating the service is saturated."
