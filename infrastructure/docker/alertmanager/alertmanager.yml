route:
  receiver: default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
    # A webhook receiver is used as a safe local default. Wire this up to the
    # notification-service or a chat integration (Slack/Teams) in each
    # environment via environment-specific overrides.
    webhook_configs:
      - url: http://notification-service:3000/internal/alerts
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: http://notification-service:3000/internal/alerts
        send_resolved: true

inhibit_rules:
  # Silence warning-level alerts if a critical alert for the same job is firing.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["job"]
