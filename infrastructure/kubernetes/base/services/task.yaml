apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  labels:
    app.kubernetes.io/name: task-service
    app.kubernetes.io/part-of: enterprise-ai-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-service
        app.kubernetes.io/part-of: enterprise-ai-crm
    spec:
      containers:
        - name: task-service
          image: ghcr.io/mhdriyascp/crm-task:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: crm-common-config
            - secretRef:
                name: crm-common-secret
          env:
            - name: SERVICE_NAME
              value: task-service
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  labels:
    app.kubernetes.io/name: task-service
    app.kubernetes.io/part-of: enterprise-ai-crm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: task-service
  ports:
    - name: http
      port: 80
      targetPort: http
