apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-common-config
  labels:
    app.kubernetes.io/part-of: enterprise-ai-crm
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  # Infrastructure endpoints (in-cluster service DNS names).
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
