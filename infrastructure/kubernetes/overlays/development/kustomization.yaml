apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crm-development
nameSuffix: ""

resources:
  - ../../base

commonLabels:
  app.kubernetes.io/environment: development

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

configMapGenerator:
  - name: crm-common-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
